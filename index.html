
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#151d32;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#65e6c0}
main{padding:20px;max-width:850px;margin:auto}
h1{text-align:center;margin-top:40px}
.subtitle{text-align:center;color:#aab4cc}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:30px 0}
.tool{background:#19243c;padding:20px;border:1px solid #34415c;border-radius:14px;color:white;cursor:pointer;text-align:left}
.tool:hover{border-color:#65e6c0}
.tool b{display:block;margin-bottom:8px;font-size:17px}
.tool span{color:#aab4cc;font-size:13px}
.panel{background:#151d32;padding:20px;border-radius:15px}
textarea{width:100%;height:110px;background:#0b1020;color:white;border:1px solid #46536d;border-radius:10px;padding:14px;font-size:16px}
button{background:#65e6c0;color:#08151a;padding:12px 20px;border:0;border-radius:9px;font-weight:bold;cursor:pointer;margin-top:12px}
#result{color:#65e6c0;margin-top:15px;white-space:pre-wrap}
footer{text-align:center;color:#8290aa;padding:30px}
@media(max-width:450px){main{padding:14px}.tools{gap:9px}.tool{padding:14px}}
</style>
</head>
<body>
<header>
<div class="logo">✦ MASTER AI</div>
<div>All-in-One AI</div>
</header>
<main>
<h1>Welcome to MASTER AI</h1>
<p class="subtitle">Your creative AI platform</p>

<div class="tools">
<button class="tool" onclick="selectTool('AI Chatbot')">💬 <b>AI Chatbot</b><span>Ask anything</span></button>
<button class="tool" onclick="selectTool('AI Image Generator')">🎨 <b>AI Image</b><span>Create images</span></button>
<button class="tool" onclick="selectTool('AI Video Generator')">🎬 <b>AI Video</b><span>Create videos</span></button>
<button class="tool" onclick="selectTool('AI Coding')">💻 <b>AI Coding</b><span>Write code</span></button>
</div>

<div class="panel">
<h2 id="heading">AI Chatbot</h2>
<textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
<button onclick="generate()">Submit Prompt</button>
<div id="result"></div>
</div>
</main>
<footer>© 2026 MASTER AI | Built for Creativity</footer>

<script>
let currentTool="AI Chatbot";
function selectTool(tool){
currentTool=tool;
document.getElementById("heading").innerText=tool;
document.getElementById("result").innerText="";
}
function generate(){
let p=document.getElementById("prompt").value.trim();
if(!p){alert("Please enter your prompt!");return;}
document.getElementById("result").innerText=
"Your "+currentTool+" prompt is ready:\n"+p+
"\n\nConnect an AI API to activate real AI generation.";
}
</script>
</body>
</html>
